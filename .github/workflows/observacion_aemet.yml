name: Observacion AEMET (rellena el hueco de los diarios)

on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 13 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

concurrency:
  group: observacion-aemet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet "pandas>=2.0" requests

      - name: Registrar la observacion de las ultimas 24 h
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python log_observacion.py --datos datos

      - name: Publicar los datos nuevos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "obs AEMET $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "No se pudo publicar tras 3 intentos" >&2
          exit 1
